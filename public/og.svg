<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="amber" cx="18%" cy="8%" r="60%">
      <stop offset="0" stop-color="#f5b942" stop-opacity=".18"/>
      <stop offset="1" stop-color="#f5b942" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint" cx="88%" cy="20%" r="55%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".13"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2433"/>
      <stop offset="1" stop-color="#0e151f"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334156"/>
      <stop offset="1" stop-color="#222c3c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#e6a92f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#080b11"/>
  <rect width="1200" height="630" fill="url(#amber)"/>
  <rect width="1200" height="630" fill="url(#mint)"/>

  <!-- logo -->
  <g transform="translate(82 76)">
    <rect width="58" height="58" rx="16" fill="url(#gold)"/>
    <circle cx="29" cy="29" r="10" fill="#191106"/>
    <circle cx="25.5" cy="25" r="3" fill="#f5b942" opacity=".55"/>
    <g stroke="#191106" stroke-width="4" stroke-linecap="round">
      <path d="M29 10v8M29 40v8M10 29h8M40 29h8M15 15l6 6M37 37l6 6M43 15l-6 6M21 37l-6 6"/>
      <path d="m17 17 4.5 4.5M36.5 36.5l4.5 4.5M41 17l-4.5 4.5M21.5 36.5 17 41"/>
    </g>
    <text x="76" y="34" font-family="Cantarell, Segoe UI, sans-serif" font-size="30" font-weight="800" letter-spacing="-1.5" fill="#eef2fa">games</text>
    <rect x="78" y="42" width="94" height="21" rx="10.5" fill="none" stroke="#f5b942" stroke-opacity=".45"/>
    <text x="125" y="57.5" text-anchor="middle" font-family="Cantarell, Segoe UI, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#f5b942">TOGETHER</text>
  </g>

  <!-- headline -->
  <g>
    <text x="80" y="270" font-family="Cantarell, Segoe UI, sans-serif" font-size="82" font-weight="800" letter-spacing="-4.5" fill="#eef2fa">Pick a game.</text>
    <text x="80" y="358" font-family="Cantarell, Segoe UI, sans-serif" font-size="82" font-weight="800" letter-spacing="-4.5" fill="#f5b942">Together.</text>
    <text x="84" y="422" font-family="Cantarell, Segoe UI, sans-serif" font-size="25" font-weight="500" fill="#94a1b6">Minesweeper or Sudoku. 2–8 friends. No signup.</text>
    <text x="84" y="458" font-family="Cantarell, Segoe UI, sans-serif" font-size="25" font-weight="500" fill="#94a1b6">Made for people in the same room.</text>
  </g>

  <!-- code pill -->
  <g transform="translate(82 500)">
    <rect width="224" height="52" rx="26" fill="#101722" stroke="#253144"/>
    <text x="24" y="24" font-family="Cantarell, Segoe UI, sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#5e6b80">ONE LINK</text>
    <text x="24" y="41" font-family="Cantarell, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#eef2fa">2–8 players</text>
  </g>

  <!-- board -->
  <g transform="translate(700 108)">
    <rect width="424" height="424" rx="26" fill="url(#panel)" stroke="#253144"/>
    <g transform="translate(22 22)">
      <!-- row 1 -->
      <g>
        <rect width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
        <rect x="62" width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
        <rect x="124" width="56" height="56" rx="8" fill="#0b1018" stroke="#151f2d"/>
        <text x="152" y="37" text-anchor="middle" font-family="Cantarell, sans-serif" font-size="26" font-weight="800" fill="#74b9ff">1</text>
        <rect x="186" width="56" height="56" rx="8" fill="#0b1018" stroke="#151f2d"/>
        <text x="214" y="37" text-anchor="middle" font-family="Cantarell, sans-serif" font-size="26" font-weight="800" fill="#4ade80">2</text>
        <rect x="248" width="56" height="56" rx="8" fill="#0b1018" stroke="#151f2d"/>
        <text x="276" y="37" text-anchor="middle" font-family="Cantarell, sans-serif" font-size="26" font-weight="800" fill="#74b9ff">1</text>
        <rect x="310" width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
      </g>
      <!-- row 2 -->
      <g transform="translate(0 62)">
        <rect width="56" height="56" rx="8" fill="#0b1018" stroke="#151f2d"/>
        <text x="28" y="37" text-anchor="middle" font-family="Cantarell, sans-serif" font-size="26" font-weight="800" fill="#74b9ff">1</text>
        <rect x="62" width="56" height="56" rx="8" fill="#0b1018" stroke="#151f2d"/>
        <text x="90" y="37" text-anchor="middle" font-family="Cantarell, sans-serif" font-size="26" font-weight="800" fill="#74b9ff">1</text>
        <rect x="124" width="56" height="56" rx="8" fill="#0b1018" stroke="#151f2d"/>
        <rect x="186" width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
        <path d="M214 14v30" stroke="#f5b942" stroke-width="3" stroke-linecap="round"/>
        <path d="M214 15c9-5 14 6 27 1v13c-13 5-18-6-27-1z" fill="#f5b942"/>
        <rect x="248" width="56" height="56" rx="8" fill="#0b1018" stroke="#151f2d"/>
        <text x="276" y="37" text-anchor="middle" font-family="Cantarell, sans-serif" font-size="26" font-weight="800" fill="#ff8a6d">3</text>
        <rect x="310" width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
      </g>
      <!-- row 3 -->
      <g transform="translate(0 124)">
        <rect width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
        <rect x="62" width="56" height="56" rx="8" fill="#0b1018" stroke="#151f2d"/>
        <text x="90" y="37" text-anchor="middle" font-family="Cantarell, sans-serif" font-size="26" font-weight="800" fill="#4ade80">2</text>
        <rect x="124" width="56" height="56" rx="8" fill="#0b1018" stroke="#151f2d"/>
        <text x="152" y="37" text-anchor="middle" font-family="Cantarell, sans-serif" font-size="26" font-weight="800" fill="#74b9ff">1</text>
        <rect x="186" width="56" height="56" rx="8" fill="#0b1018" stroke="#151f2d"/>
        <rect x="248" width="56" height="56" rx="8" fill="#0b1018" stroke="#151f2d"/>
        <text x="276" y="37" text-anchor="middle" font-family="Cantarell, sans-serif" font-size="26" font-weight="800" fill="#74b9ff">1</text>
        <rect x="310" width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
      </g>
      <!-- row 4 -->
      <g transform="translate(0 186)">
        <rect width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
        <rect x="62" width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
        <rect x="124" width="56" height="56" rx="8" fill="#0b1018" stroke="#151f2d"/>
        <text x="152" y="37" text-anchor="middle" font-family="Cantarell, sans-serif" font-size="26" font-weight="800" fill="#74b9ff">1</text>
        <rect x="186" width="56" height="56" rx="8" fill="#0b1018" stroke="#151f2d"/>
        <text x="214" y="37" text-anchor="middle" font-family="Cantarell, sans-serif" font-size="26" font-weight="800" fill="#4ade80">2</text>
        <rect x="248" width="56" height="56" rx="8" fill="#0b1018" stroke="#151f2d"/>
        <rect x="310" width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
      </g>
      <!-- row 5 -->
      <g transform="translate(0 248)">
        <rect width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
        <rect x="62" width="56" height="56" rx="8" fill="#3d1a1a" stroke="#6f2d29"/>
        <circle cx="90" cy="28" r="13" fill="#ff8468"/>
        <g stroke="#ff8468" stroke-width="3" stroke-linecap="round">
          <path d="M90 10v5M90 41v5M72 28h5M103 28h5"/>
        </g>
        <rect x="124" width="56" height="56" rx="8" fill="#0b1018" stroke="#151f2d"/>
        <rect x="186" width="56" height="56" rx="8" fill="#0b1018" stroke="#151f2d"/>
        <rect x="248" width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
        <rect x="310" width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
      </g>
      <!-- row 6 -->
      <g transform="translate(0 310)">
        <rect width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
        <rect x="62" width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
        <rect x="124" width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
        <rect x="186" width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
        <rect x="248" width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
        <rect x="310" width="56" height="56" rx="8" fill="url(#tile)" stroke="#3a4a63"/>
      </g>
    </g>
  </g>

  <!-- cursors -->
  <g transform="translate(800 420)">
    <path d="M0 0 18 10 9 12 5 21Z" fill="#ff7a59" stroke="#080b11" stroke-width="1.5"/>
    <rect x="14" y="15" width="78" height="24" rx="12" fill="#101722" stroke="#ff7a59" stroke-opacity=".6"/>
    <text x="53" y="31" text-anchor="middle" font-family="Cantarell, sans-serif" font-size="12" font-weight="700" fill="#ffb4a2">Maya</text>
  </g>
  <g transform="translate(1010 210)">
    <path d="M0 0 18 10 9 12 5 21Z" fill="#2dd4bf" stroke="#080b11" stroke-width="1.5"/>
    <rect x="14" y="15" width="70" height="24" rx="12" fill="#101722" stroke="#2dd4bf" stroke-opacity=".6"/>
    <text x="49" y="31" text-anchor="middle" font-family="Cantarell, sans-serif" font-size="12" font-weight="700" fill="#9beadf">Sam</text>
  </g>
</svg>
